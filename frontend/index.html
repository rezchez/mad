<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سامانه مدرسه</title>
  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="card-header">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path>
            <path d="M6 10h10"></path>
          </svg>
        </div>
        <h2>ورود به حساب کاربری</h2>
        <p class="subtitle">جهت ورود، نام کاربری یا ایمیل و رمز عبور خود را وارد کنید</p>
      </div>

      <div id="alertMessage" class="alert-box" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="identity">نام کاربری یا ایمیل</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="identity" 
              name="identity" 
              placeholder="مثال: user@example.com یا نام کاربری" 
              autocomplete="username" 
              required
            >
            <span class="field-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          </div>
          <span class="error-text" id="identityError"></span>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">رمز عبور</label>
            <a href="#" class="forgot-link">فراموشی رمز؟</a>
          </div>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••" 
              autocomplete="current-password" 
              required
            >
            <button type="button" class="toggle-password" id="togglePassword" aria-label="نمایش یا مخفی کردن رمز">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-text" id="passwordError"></span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>مرا به خاطر بسپار</span>
          </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-text">ورود به سیستم</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="card-footer">
        <p>حساب کاربری ندارید؟ <a href="#">ثبت‌نام کنید</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
